name: Secret CI Pipeline

on:
  push:
    branches:
      - main
      - feature/github-secrets
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      APP_ENV: ${{ secrets.APP_ENV }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate Secret
        run: |
          if [ -z "$APP_ENV" ]; then
            echo "APP_ENV secret is not configured"
            exit 1
          else
            echo "APP_ENV secret is configured"
          fi